<!-- TORTA -->


<section class="cake-section">


    <h1>
        🎂 Buon 18° Compleanno Amore Mio ❤️
    </h1>


    <p class="subtitle">
        Esprimi un desiderio e soffia sulle candeline ✨
    </p>



    <div class="cake">


        <!-- NUMERO 18 CANDELE -->

        <div class="number-candles">

            <div class="candle-number one">

                <span class="flame"></span>

                1

            </div>


            <div class="candle-number eight">

                <span class="flame"></span>

                8

            </div>


        </div>




        <!-- STRATI TORTA -->

        <div class="cake-layer layer-one"></div>

        <div class="cake-layer layer-two"></div>

        <div class="cake-layer layer-three"></div>



        <!-- PIATTO -->

        <div class="plate"></div>


    </div>




    <!-- PULSANTE -->

    <button id="spegnicandeline">
        Spegni le candeline 🎂
    </button>


    <!-- CONTENITORE CORIANDOLI -->

    <div id="coriandoli"></div>




    <!-- MESSAGGIO DOPO -->

    <div class="birthday-message">

        <h2>
            ✨ Il mio desiderio sei tu ❤️
        </h2>


        <p class="pp">
            Grazie per tutti i momenti passati insieme.
            <br>
            Buon 18° amore mio 💕
        </p>


    </div>
